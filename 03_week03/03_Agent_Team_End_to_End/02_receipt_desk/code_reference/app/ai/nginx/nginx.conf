user root;
worker_processes 4;
worker_rlimit_nofile 65536;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 8192;
}

http {
    default_type application/json;
    map_hash_bucket_size 256;

    log_format lb '$time_iso8601 $remote_addr "$request" $status replica=$replica '
                  'upstream=$upstream_addr upstream_status=$upstream_status first_byte=$upstream_header_time total=$request_time';
    access_log /var/log/nginx/access.log lb;

    map $http_authorization $auth_ok {
        default 0;
        include /etc/nginx/runtime/apikey.map;
    }

    include /etc/nginx/runtime/pool.conf;

    upstream receipt_dp1 {
        zone receipt_dp1 64k;
        least_conn;
        server 127.0.0.1:8001 max_fails=1 fail_timeout=30s;
        keepalive 64;
    }

    upstream receipt_dp2 {
        zone receipt_dp2 64k;
        least_conn;
        server 127.0.0.1:8001 max_fails=1 fail_timeout=30s;
        server 127.0.0.1:8002 max_fails=1 fail_timeout=30s;
        keepalive 64;
    }

    map "$pool|$upstream_addr" $replica {
        default                                    "unknown";
        "~^receipt_dp1\|(.*, )?127\.0\.0\.1:8001$" "gpu0";
        "~^receipt_dp2\|(.*, )?127\.0\.0\.1:8001$" "gpu0";
        "~^receipt_dp2\|(.*, )?127\.0\.0\.1:8002$" "gpu1";
    }

    server {
        listen 8080;
        client_max_body_size 15m;

        location = /lb-health {
            add_header Content-Type application/json always;
            return 200 '{"status":"ok","lb":"nginx-1.27","strategy":"least_conn","pool":"$pool"}\n';
        }

        location / {
            if ($auth_ok = 0) {
                return 401 '{"error":{"message":"missing or invalid API key","type":"unauthorized","code":401}}\n';
            }

            proxy_pass http://$pool;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;
            gzip off;
            chunked_transfer_encoding on;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 2s;

            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries 3;

            add_header X-Replica $replica always;
            add_header X-Replica-Addr $upstream_addr always;
        }
    }
}
