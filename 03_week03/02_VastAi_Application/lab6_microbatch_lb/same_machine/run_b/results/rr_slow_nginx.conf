# LAB 6 - NGINX = the only door of the system (load balancer) in front of the detect servers.
# Runs inside the official nginx:1.27 image (udocker); this file is mounted at /etc/nginx/nginx.conf.
# cluster.sh rewrites ONLY the lines between marker pairs (# BEGIN x / # END x): LB, SERVERS, FAILOVER.

# ---------- 1. process ----------
user root;                               # udocker has no user namespace: workers stay the same user as the master
worker_processes 4;                      # fixed (auto would be 64 here, the container only has ~25 cores of quota)
worker_rlimit_nofile 16384;             # open-file limit of each worker (default 1024 is below worker_connections)
pid /var/log/nginx/nginx.pid;            # /var/log/nginx is a host folder (logs/nginx) -> cluster.sh can read the pid
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;             # per worker; one proxied request uses 2 (client side + server side)
}

http {
    # ---------- 2. log: which server answered, and how long it took ----------
    log_format lb '$remote_addr [$time_iso8601] "$request" $status bytes_in=$request_length '
                  'total=$request_time upstream=$upstream_addr upstream_time=$upstream_response_time';
    access_log /var/log/nginx/access.log lb buffer=64k flush=1s;   # the Authorization header is never logged
    server_tokens off;
    default_type application/json;

    # ---------- 3. upload limits (same 20 MB limit as the server) ----------
    client_max_body_size 20m;
    client_body_buffer_size 2m;          # a normal photo stays in RAM, no temp file

    # ---------- 4. the group of servers ----------
    # Balancing method = the one line between the LB markers (cluster.sh up --lb rr|lc|p2c writes it):
    #   no directive           = Round Robin          : requests go to the servers in turn
    #   least_conn;            = Least Connections    : the server with the fewest unanswered requests gets the next one
    #   random two least_conn; = Power of Two Choices : 2 servers picked at random, the one with fewer unanswered requests
    upstream detect_servers {
        zone detect_servers 64k;         # shared memory: the 4 workers share ONE turn / ONE count of open requests
        # BEGIN LB (written by cluster.sh)
        # (no directive)                 # Round Robin
        # END LB
        # BEGIN SERVERS (written by cluster.sh)
        server 127.0.0.1:8101;           # gpu0 server 1
        server 127.0.0.1:8201;           # gpu1 server 1
        server 127.0.0.1:8102;           # gpu0 server 2
        server 127.0.0.1:8202;           # gpu1 server 2
        server 127.0.0.1:8103;           # gpu0 server 3
        server 127.0.0.1:8203;           # gpu1 server 3
        server 127.0.0.1:8104;           # gpu0 server 4
        server 127.0.0.1:8204;           # gpu1 server 4
        # END SERVERS
        keepalive 64;                    # keep idle connections to the servers open for reuse
    }

    # ---------- 5. the door: port 8080 ----------
    server {
        listen 8080 backlog=4096;

        # answered by NGINX itself: is the door open?
        location = /lb/health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx"}\n';
        }

        # forwarded: health of one server (round robin picks which one)
        location = /health {
            proxy_pass http://detect_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header X-Upstream $upstream_addr always;
        }

        # the API
        location /v1/ {
            # no key at all -> refuse here, the upload never reaches a GPU server.
            # (NGINX does not know the key: a wrong key is checked and refused by the server.)
            if ($http_authorization = "") {
                add_header WWW-Authenticate Bearer always;
                add_header X-Rejected-By nginx always;
                return 401 '{"detail":"missing API key"}\n';
            }

            proxy_pass http://detect_servers;
            proxy_http_version 1.1;                  # needed for keepalive to the servers
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_request_buffering on;              # read the whole upload first, then give it to a server at once
            proxy_connect_timeout 2s;                # servers are on the same machine
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
            # What NGINX does when a server fails = the lines between the FAILOVER markers plus the options on
            # the "server" lines above (cluster.sh up --failover default|on|off writes both):
            #   default : as in all capacity measurements (retry only if the request was not sent yet; NGINX
            #             defaults max_fails=1 fail_timeout=10s)
            #   on      : a failed request goes to the next server, also when it was already sent (POST);
            #             a server that failed gets no requests for 10 s
            #   off     : no retry (the user gets 502) and a dead server stays in the rotation
            # BEGIN FAILOVER (written by cluster.sh)
            proxy_next_upstream error timeout;       # server unreachable -> try the next one
            # END FAILOVER

            add_header X-Upstream $upstream_addr always;   # which server answered (for the tests)
        }

        location / {
            return 404 '{"detail":"not found"}\n';
        }
    }
}
