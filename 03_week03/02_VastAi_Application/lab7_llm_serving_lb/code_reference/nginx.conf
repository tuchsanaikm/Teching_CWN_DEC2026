# NGINX Load Balancer for LAB 7 (Single-Node Multi-GPU LLM Serving, image nginx:1.27 via udocker)
# Runtime files in /etc/nginx/runtime/:
#   apikey.map : "Bearer <key>" 1;
#   pool.conf  : map $host $pool { default shop_dp2; }  (shop_dp1 | shop_dp2 | shop_dp4 | shop_mp2 | shop_fake)

user root;
worker_processes 4;
worker_rlimit_nofile 65536;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 8192;
}

http {
    default_type application/json;
    map_hash_bucket_size 256;

    log_format lb '$time_iso8601 $remote_addr "$request" $status replica=$replica '
                  'upstream=$upstream_addr upstream_status=$upstream_status first_byte=$upstream_header_time total=$request_time';
    access_log /var/log/nginx/access.log lb;

    map $http_authorization $auth_ok {
        default 0;
        include /etc/nginx/runtime/apikey.map;
    }

    include /etc/nginx/runtime/pool.conf;

    # Single GPU: 1 replica (GPU 0)
    upstream shop_dp1 {
        zone shop_dp1 64k;
        least_conn;
        server 127.0.0.1:8001 max_fails=1 fail_timeout=30s;
        keepalive 64;
    }

    # Data Parallel 2x1: 2 replicas (GPU 0, GPU 1)
    upstream shop_dp2 {
        zone shop_dp2 64k;
        least_conn;
        server 127.0.0.1:8001 max_fails=1 fail_timeout=30s;
        server 127.0.0.1:8002 max_fails=1 fail_timeout=30s;
        keepalive 64;
    }

    # Data Parallel 4x1: 4 replicas (GPU 0, 1, 2, 3)
    upstream shop_dp4 {
        zone shop_dp4 64k;
        least_conn;
        server 127.0.0.1:8001 max_fails=1 fail_timeout=30s;
        server 127.0.0.1:8002 max_fails=1 fail_timeout=30s;
        server 127.0.0.1:8003 max_fails=1 fail_timeout=30s;
        server 127.0.0.1:8004 max_fails=1 fail_timeout=30s;
        keepalive 64;
    }

    # Model Parallel 2+2: 2 replicas, each using 2 GPUs (GPU 0+1, GPU 2+3)
    upstream shop_mp2 {
        zone shop_mp2 64k;
        least_conn;
        server 127.0.0.1:8001 max_fails=1 fail_timeout=30s;
        server 127.0.0.1:8002 max_fails=1 fail_timeout=30s;
        keepalive 64;
    }

    # Fake LLM for loadgen verification
    upstream shop_fake {
        zone shop_fake 64k;
        least_conn;
        server 127.0.0.1:9000;
        keepalive 64;
    }

    map "$pool|$upstream_addr" $replica {
        default                                "unknown";
        "~^shop_dp1\|(.*, )?127\.0\.0\.1:8001$" "gpu0";
        "~^shop_dp2\|(.*, )?127\.0\.0\.1:8001$" "gpu0";
        "~^shop_dp2\|(.*, )?127\.0\.0\.1:8002$" "gpu1";
        "~^shop_dp4\|(.*, )?127\.0\.0\.1:8001$" "gpu0";
        "~^shop_dp4\|(.*, )?127\.0\.0\.1:8002$" "gpu1";
        "~^shop_dp4\|(.*, )?127\.0\.0\.1:8003$" "gpu2";
        "~^shop_dp4\|(.*, )?127\.0\.0\.1:8004$" "gpu3";
        "~^shop_mp2\|(.*, )?127\.0\.0\.1:8001$" "gpu0+1";
        "~^shop_mp2\|(.*, )?127\.0\.0\.1:8002$" "gpu2+3";
        "~^shop_fake\|"                         "fake";
    }

    server {
        listen 8080;
        client_max_body_size 2m;

        location / {
            if ($auth_ok = 0) {
                return 401 '{"error":{"message":"missing or invalid API key","type":"unauthorized","code":401}}\n';
            }

            proxy_pass http://$pool;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;
            gzip off;
            chunked_transfer_encoding on;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 2s;

            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries 3;

            add_header X-Replica $replica always;
            add_header X-Replica-Addr $upstream_addr always;
        }
    }
}
