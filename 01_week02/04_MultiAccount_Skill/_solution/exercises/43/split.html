<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>หารค่าอาหาร</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, "Leelawadee UI", Tahoma, sans-serif;
      color: #222821;
      background: #f4f3ea;
      --green: #254c38;
      --muted: #555e53;
      --error: #a42520;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: radial-gradient(ellipse at top, #e4ead9, transparent 70%);
    }

    main {
      width: min(100%, 480px);
      padding: clamp(22px, 5vw, 40px);
      border: 1px solid #dce1d3;
      border-radius: 24px;
      background: #fffef9;
      box-shadow: 0 16px 48px #263e2710;
    }

    header { margin-bottom: 26px; }
    h1 { margin: 0; color: var(--green); font-size: clamp(1.8rem, 6vw, 2.5rem); }
    header p { margin: 6px 0 0; color: var(--muted); line-height: 1.6; }

    form, .fields { display: grid; gap: 18px; }
    .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .field:first-child { grid-column: 1 / -1; }
    label { display: block; margin-bottom: 6px; font-weight: 650; }

    .control { position: relative; }
    .unit {
      position: absolute;
      inset-inline-end: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    input, button { width: 100%; font: inherit; }
    input {
      appearance: textfield;
      min-height: 49px;
      padding: 10px 51px 10px 14px;
      border: 1px solid #b9c4b6;
      border-radius: 10px;
      background: #fff;
      color: inherit;
      font-variant-numeric: tabular-nums;
    }
    input::-webkit-inner-spin-button, input::-webkit-outer-spin-button {
      appearance: none;
      margin: 0;
    }
    input::placeholder { color: #697269; }
    :focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
    input[aria-invalid="true"] { border-color: var(--error); }
    .error { margin: 6px 0 0; color: var(--error); font-size: .875rem; line-height: 1.5; }

    button {
      min-height: 49px;
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      background: var(--green);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #1c3d2d; }

    output {
      display: block;
      padding: 17px 18px;
      border-radius: 12px;
      background: #e7efdd;
      color: var(--green);
    }
    .result-label { display: block; font-weight: 650; }
    #amount {
      display: block;
      margin-top: 3px;
      overflow-wrap: anywhere;
      font-size: 1.85rem;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }
    @media (max-width: 360px) {
      .fields { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>หารค่าอาหาร</h1>
      <p>รวมค่าบริการแล้วหารเท่ากัน ปัดขึ้นเป็นบาทเต็ม</p>
    </header>

    <form id="split-form" novalidate>
      <div class="fields">
        <div class="field">
          <label for="total">ยอดรวม</label>
          <div class="control">
            <input id="total" name="total" type="number" inputmode="decimal" min="0" step="any" placeholder="0.00" aria-describedby="total-unit total-error" required>
            <span class="unit" id="total-unit">บาท</span>
          </div>
          <p class="error" id="total-error" hidden>กรอกยอดรวมเป็นตัวเลขตั้งแต่ 0 บาทขึ้นไป</p>
        </div>

        <div class="field">
          <label for="n">จำนวนคน</label>
          <div class="control">
            <input id="n" name="n" type="number" inputmode="numeric" min="1" step="1" aria-describedby="n-unit n-error" required>
            <span class="unit" id="n-unit">คน</span>
          </div>
          <p class="error" id="n-error" hidden>กรอกจำนวนเต็มตั้งแต่ 1 คนขึ้นไป</p>
        </div>

        <div class="field">
          <label for="svc">ค่าบริการ</label>
          <div class="control">
            <input id="svc" name="svc" type="number" inputmode="decimal" min="0" step="any" value="0" aria-describedby="svc-unit svc-error" required>
            <span class="unit" id="svc-unit">%</span>
          </div>
          <p class="error" id="svc-error" hidden>กรอกค่าบริการเป็นตัวเลขตั้งแต่ 0% ขึ้นไป</p>
        </div>
      </div>

      <button type="submit">คำนวณยอดต่อคน</button>
      <output id="result" for="total n svc" hidden>
        <span class="result-label">ยอดต่อคน</span>
        <strong id="amount"></strong>
      </output>
    </form>
  </main>

  <script>
    const form = document.getElementById('split-form');
    const total = document.getElementById('total');
    const people = document.getElementById('n');
    const service = document.getElementById('svc');
    const result = document.getElementById('result');
    const amount = document.getElementById('amount');
    const fields = [total, people, service];
    const touched = new Set();
    const formatter = new Intl.NumberFormat('th-TH');

    function decimalFraction(input) {
      const value = input.valueAsNumber;
      if (!Number.isFinite(value)) return null;

      const [mantissa, exponent = '0'] = input.value.toLowerCase().split('e');
      const [whole, decimal = ''] = mantissa.split('.');
      const digits = BigInt(`${whole}${decimal}`);
      if (digits < 0n) return null;
      if (value === 0) return { numerator: 0n, denominator: 1n };

      const places = decimal.length - Number(exponent);
      return {
        numerator: digits * 10n ** BigInt(Math.max(0, -places)),
        denominator: 10n ** BigInt(Math.max(0, places))
      };
    }

    function perPerson(total, people, service) {
      // total × (100 + service) / (100 × people), kept as an exact fraction.
      const serviceBase = 100n * service.denominator;
      const numerator = total.numerator * (serviceBase + service.numerator);
      const denominator = total.denominator * serviceBase * people;

      const scale = 1_000_000n;
      const rounded = (2n * numerator * scale + denominator) / (2n * denominator);
      return (rounded + scale - 1n) / scale;
    }

    function update() {
      const [totalValue, peopleValue, serviceValue] = fields.map(decimalFraction);
      const validPeople = peopleValue !== null &&
        peopleValue.numerator >= peopleValue.denominator &&
        peopleValue.numerator % peopleValue.denominator === 0n;
      const valid = [totalValue !== null, validPeople, serviceValue !== null];

      fields.forEach((field, index) => {
        const showError = touched.has(field) && !valid[index];
        document.getElementById(`${field.id}-error`).hidden = !showError;
        if (showError) field.setAttribute('aria-invalid', 'true');
        else field.removeAttribute('aria-invalid');
      });

      const allValid = valid.every(Boolean);
      result.hidden = !allValid;
      if (allValid) {
        const count = peopleValue.numerator / peopleValue.denominator;
        amount.textContent = `${formatter.format(perPerson(totalValue, count, serviceValue))} บาท`;
      } else {
        amount.textContent = '';
      }
      return fields[valid.indexOf(false)];
    }

    for (const field of fields) {
      const checkField = () => {
        touched.add(field);
        update();
      };
      field.addEventListener('input', checkField);
      field.addEventListener('blur', checkField);
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      fields.forEach((field) => touched.add(field));
      update()?.focus();
    });

    update();
  </script>
</body>
</html>
